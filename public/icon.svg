<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="lexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF3D4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#947515" />
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F26" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#navyBg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Outer Gold Hexagon / Shield Accent -->
  <polygon points="64,16 104,38 104,90 64,112 24,90 24,38" fill="none" stroke="url(#lexGold)" stroke-width="2.5" opacity="0.6"/>

  <!-- Scales of Justice & Monogram LM -->
  <!-- Pillar & Base -->
  <line x1="64" y1="36" x2="64" y2="88" stroke="url(#lexGold)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="88" x2="80" y2="88" stroke="url(#lexGold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="34" r="5.5" fill="url(#lexGold)"/>
  
  <!-- Balance Beam -->
  <path d="M 38 46 Q 64 42 90 46" fill="none" stroke="url(#lexGold)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Left Scale Pan -->
  <line x1="38" y1="46" x2="30" y2="64" stroke="url(#lexGold)" stroke-width="1.8"/>
  <line x1="38" y1="46" x2="46" y2="64" stroke="url(#lexGold)" stroke-width="1.8"/>
  <path d="M 26 64 Q 38 72 50 64 Z" fill="url(#lexGold)" opacity="0.85"/>

  <!-- Right Scale Pan -->
  <line x1="90" y1="46" x2="82" y2="64" stroke="url(#lexGold)" stroke-width="1.8"/>
  <line x1="90" y1="46" x2="98" y2="64" stroke="url(#lexGold)" stroke-width="1.8"/>
  <path d="M 78 64 Q 90 72 102 64 Z" fill="url(#lexGold)" opacity="0.85"/>
</svg>
